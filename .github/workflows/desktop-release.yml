# Builds the desktop app (macOS dmg/zip for arm64 + x64, Windows installer) and smoke-tests the packaged app on both
# operating systems.
#
# Two ways to run it:
#   - Push a `v*` tag: the tag must match "version" in package.json (tag v0.2.0 <-> "version": "0.2.0"). The files are
#     uploaded to a DRAFT GitHub release for that tag. Publish the draft by hand (Releases -> Edit -> Publish) once
#     checked; installed apps only see published releases.
#   - Run it by hand (Actions -> Desktop release -> Run workflow): packages the selected branch without the tag check
#     and without a release. The files are only uploaded as workflow artifacts, so you can test packaging safely.
#
# See docs/releasing.md for the full release steps.
#
# Signing is optional. Without these repository secrets the builds are unsigned (ad-hoc signed on macOS, see
# docs/desktop.md):
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD                     Developer ID Application certificate (.p12, base64) + password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization (used only when the app is signed)
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                     Windows code-signing certificate (.pfx, base64) + password
#
# Permissions: the build jobs (which run `npm ci` and dependency code) only read; `contents: write`, needed to create
# the release, is granted to the release job alone, which runs no project code. Actions are pinned to commit SHAs.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "::error title=Tag does not match package.json::Tag $GITHUB_REF_NAME does not match package.json version $version. To fix it: (1) on main run 'npm version $tag_version --no-git-tag-version', commit package.json and package-lock.json and push; (2) delete the tag with 'git tag -d $GITHUB_REF_NAME && git push origin :refs/tags/$GITHUB_REF_NAME'; (3) tag the new commit and push it again with 'git tag $GITHUB_REF_NAME && git push origin $GITHUB_REF_NAME'. See docs/releasing.md."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $version"

      - run: npm ci

      # The unit tests are platform independent and already run on every push and pull request (ci.yml, Linux).
      # They run once more here, on macOS; on Windows the packaged app is checked by the smoke test below.
      - run: npm test
        if: runner.os == 'macOS'

      - run: npm run build

      # Only secrets that are set become environment variables: electron-builder treats a present-but-empty
      # variable differently from a missing one.
      - name: Configure code signing (optional)
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          put() {
            local delim
            delim="EOF_$(node -e "process.stdout.write(require('node:crypto').randomBytes(8).toString('hex'))")"
            { echo "$1<<$delim"; echo "$2"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              put CSC_LINK "$MAC_CSC_LINK"
              put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
              for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                if [ -n "${!v}" ]; then put "$v" "${!v}"; fi
              done
              echo "macOS: signing enabled"
            else
              # Without a certificate, sign ad-hoc. A bundle with no signature at all is reported as "damaged" by
              # Gatekeeper after a download on Apple silicon, with no way to open it from System Settings. Hardened
              # runtime is turned off for ad-hoc builds only: its library validation rejects the pre-signed Electron
              # frameworks when the app has no Team ID. Signed builds keep hardened runtime.
              put CSC_IDENTITY_AUTO_DISCOVERY false
              put EB_MAC_ARGS "-c.mac.identity=- -c.mac.hardenedRuntime=false"
              echo "macOS: no certificate, building ad-hoc signed"
            fi
          else
            if [ -n "$WIN_CSC_LINK" ]; then
              put WIN_CSC_LINK "$WIN_CSC_LINK"
              put WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
              echo "Windows: signing enabled"
            else
              echo "Windows: no certificate, building unsigned"
            fi
          fi

      # EB_MAC_ARGS is only set for unsigned macOS builds (see above); it is left unquoted so it splits into arguments.
      - name: Package
        shell: bash
        run: npx electron-builder --publish never $EB_MAC_ARGS

      # electron-builder writes the arm64 app to release/mac-arm64 and the x64 app to release/mac. Run the one that
      # matches the runner's CPU.
      - name: Smoke test the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then dir="release/mac-arm64"; else dir="release/mac"; fi
          bin="$dir/Project HQ.app/Contents/MacOS/Project HQ"
          if [ ! -x "$bin" ]; then
            echo "::error::Packaged app not found at $bin"
            ls -la release
            exit 1
          fi
          "$bin" --smoke-test

      # The Windows build is a GUI app: start it with Start-Process so the step waits for it and gets its exit code,
      # and collect its output from files.
      - name: Smoke test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release\win-unpacked\Project HQ.exe'
          if (-not (Test-Path $exe)) {
            Write-Output "::error::Packaged app not found at $exe"
            Get-ChildItem release
            exit 1
          }
          $out = Join-Path $env:RUNNER_TEMP 'smoke-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'smoke-err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Write-Output "::error::Smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Project HQ $TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
