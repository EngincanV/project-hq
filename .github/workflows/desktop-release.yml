# Builds the desktop app (macOS dmg/zip for arm64 + x64, Windows installer) when a `v*` tag is pushed and uploads the
# files to a DRAFT GitHub release for that tag. Publish the draft by hand (Releases → Edit → Publish) once checked;
# installed apps only see published releases.
#
# The tag must match "version" in package.json (tag v0.2.0 ↔ "version": "0.2.0").
#
# Signing is optional. Without these repository secrets the builds are unsigned (see README → Desktop app):
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD                     Developer ID Application certificate (.p12, base64) + password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization (used only when the app is signed)
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                     Windows code-signing certificate (.pfx, base64) + password
#
# Permissions: the build jobs (which run `npm ci` and dependency code) only read; `contents: write`, needed to create
# the release, is granted to the release job alone, which runs no project code. Actions are pinned to commit SHAs.
name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Only secrets that are set become environment variables: electron-builder treats a present-but-empty
      # variable differently from a missing one.
      - name: Configure code signing (optional)
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          put() {
            local delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; echo "$2"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              put CSC_LINK "$MAC_CSC_LINK"
              put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
              for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                if [ -n "${!v}" ]; then put "$v" "${!v}"; fi
              done
              echo "macOS: signing enabled"
            else
              put CSC_IDENTITY_AUTO_DISCOVERY false
              echo "macOS: no certificate, building unsigned"
            fi
          else
            if [ -n "$WIN_CSC_LINK" ]; then
              put WIN_CSC_LINK "$WIN_CSC_LINK"
              put WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
              echo "Windows: signing enabled"
            else
              echo "Windows: no certificate, building unsigned"
            fi
          fi

      - name: Package
        run: npx electron-builder --publish never

      - name: Smoke test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: '"release/mac-arm64/Project HQ.app/Contents/MacOS/Project HQ" --smoke-test'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Project HQ $TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
