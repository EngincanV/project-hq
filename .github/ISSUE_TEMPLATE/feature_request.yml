name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Project HQ is small on purpose. Describing the problem you want solved helps more than a finished design.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, or workarounds you use now.
  - type: dropdown
    id: variant
    attributes:
      label: Where would you use it?
      multiple: true
      options:
        - Desktop app
        - From source in the browser
        - PWA / GitHub mode
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this.
